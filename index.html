<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Glassmorphism Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div id="cursor-glow"></div>

    <main class="glass-wrapper">
        <header class="glass-navbar">
            <div class="logo">Glass<span>UI</span></div>
            
            <button class="menu-toggle" id="menuBtn" aria-label="Toggle Menu">
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="#" class="active">Home</a>
                <a href="#">Explore</a>
                <a href="#">Settings</a>
            </nav>
        </header>

        <section class="glass-card">
            <h1>Dynamic Interaction Active</h1>
            <p>Your workspace is fully responsive. Move your mouse across the desktop canvas screen frame to feel the real-time lighting adjustments tracker update dynamically.</p>
            <a href="#" class="glass-btn" id="actionBtn">Trigger Prompt Effect</a>
        </section>
    </main>
    <script src="scripr.js"></script>
</body>
</html>
