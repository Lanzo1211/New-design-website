<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div id="cursor-glow"></div>

    <main class="glass-wrapper">
        <header class="glass-navbar">
            <div class="logo">Glass<span>UI</span></div>
            
            <button class="menu-toggle" id="menuBtn" aria-label="Toggle Menu">
                <span></span>
                <span></span>
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="#" class="nav-item active" data-tab="home"> Home</a>
                <a href="#" class="nav-item " data-tab="Explore">Explore</a>
                <a href="#" class="nav-item" data-tab="settings">Settings</a>
            </nav>
        </header>

        <section class="glass-card">
            <h1 id="main-title">The future  starts here</h1>
            <p id="main-text">Connect with a growing network of creators, builders, and innovators. Access exclusive resources, collaborate on projects, and level up your skills alongside peers.</p>
            <a href="#" class="glass-btn" id="actionBtn">Join</a>
        </section>
    </main>
    
    <div class="earth-container">
        <div class="earth-globe">
            <div class="earth-landmass"></div>
            <div class="earth-ping ping-1"></div>
            <div class="earth-ping ping-2"></div>
        </div>
        <p class="earth-text">Connecting</p>
    </div>

    <script src="scripr.js"></script>
